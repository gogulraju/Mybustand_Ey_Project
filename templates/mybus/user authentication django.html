<html>
<head>
  <meta charset="utf-8" />
  <title>Authentication</title>
</head>
<body>
  <h1>Authentication</h1>

  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}

  </p>

  <p><a href="/">Home</a></p>

</html>
